<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>커피쏘기 사다리타기</title>
<style>
:root{--bg:#f7f4ef;--card:#fffdf9;--text:#2f2a26;--muted:#7a7068;--line:#e8ded4;--accent:#6f4e37;--accent2:#c98b55;--good:#3f7d5c;--danger:#b9574f;--shadow:0 14px 34px rgba(74,54,40,.10)}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#fbf8f4,#f4eee7);color:var(--text)}button,input{font:inherit}.app{max-width:1100px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.hero h1{margin:0;font-size:clamp(26px,5vw,42px);letter-spacing:-.05em}.hero p{margin:8px 0 0;color:var(--muted)}.badge{background:#efe4d8;border:1px solid #dfc9b2;padding:9px 12px;border-radius:999px;font-weight:800;color:#6b4b32;white-space:nowrap}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;min-width:0}.card h2{margin:0 0 8px}.helper{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 14px}.people{display:grid;gap:9px}.person{display:flex;gap:8px}.person input{min-width:0;flex:1;border:1px solid #d9cec3;border-radius:12px;padding:12px 13px;min-height:44px;outline:none}.person input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(111,78,55,.12)}.btn{border:0;border-radius:12px;padding:11px 14px;min-height:44px;font-weight:800;cursor:pointer;background:#eee7df;color:var(--text)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}.btn.good{background:#e9f5ee;color:#2f6b4d}.btn.danger{background:#fff0ee;color:#a2453f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stage-wrap{overflow-x:auto}.stage{min-width:620px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#fffefb,#faf6f1);padding:12px}canvas{width:100%;height:auto;display:block}.result{margin-top:12px;padding:14px;border-radius:14px;background:#f6efe8;border:1px solid #e5d4c3;line-height:1.8;font-weight:800}.status{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px}.coffee{font-size:42px;margin-bottom:6px}@media(max-width:820px){.app{padding:14px}.hero{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body>
<main class="app">
  <header class="hero">
    <div><div class="coffee">☕</div><h1>커피쏘기 사다리타기</h1><p>이름만 입력하고 오늘 커피를 쏠 사람을 뽑아보세요.</p></div>
    <div class="badge">단일 HTML · 반응형</div>
  </header>

  <section class="grid">
    <div class="card">
      <h2>참가자</h2>
      <p class="helper">2명부터 8명까지 참여할 수 있습니다. 빈 이름은 자동으로 참가자 번호로 표시됩니다.</p>
      <div id="people" class="people"></div>
      <div class="actions">
        <button class="btn" id="addPerson" type="button">+ 참가자 추가</button>
        <button class="btn danger" id="reset" type="button">기본값</button>
      </div>
      <div class="actions">
        <button class="btn primary" id="make" type="button">사다리 만들기</button>
        <button class="btn good" id="run" type="button">☕ 커피쏘기 결과 공개</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2>사다리</h2>
      <div class="stage-wrap"><div class="stage"><canvas id="ladder" width="980" height="620"></canvas></div></div>
      <div class="result" id="result">참가자를 확인한 뒤 <b>사다리 만들기</b>를 눌러주세요.</div>
    </div>
  </section>
</main>
<script>
(()=>{
  const people=document.getElementById('people');
  const canvas=document.getElementById('ladder');
  const ctx=canvas.getContext('2d');
  const result=document.getElementById('result');
  const status=document.getElementById('status');
  let ladder=null;

  function addPerson(name=''){
    if(people.children.length>=8){status.textContent='참가자는 최대 8명까지 가능합니다.';return;}
    const row=document.createElement('div');row.className='person';
    const input=document.createElement('input');input.type='text';input.maxLength=20;input.placeholder='이름';input.value=name;
    const del=document.createElement('button');del.type='button';del.className='btn danger';del.textContent='×';del.setAttribute('aria-label','참가자 삭제');
    del.addEventListener('click',()=>{if(people.children.length<=2){status.textContent='최소 2명은 필요합니다.';return;}row.remove();ladder=null;drawEmpty();});
    row.append(input,del);people.appendChild(row);
  }
  function reset(){people.innerHTML='';['윤희','민수','지영','현우'].forEach(addPerson);ladder=null;drawEmpty();status.textContent='기본 참가자로 초기화했습니다.'}
  function names(){return [...people.querySelectorAll('input')].map((el,i)=>el.value.trim()||`참가자 ${i+1}`)}
  function makeLadder(){
    const ns=names(),n=ns.length;if(n<2)return;
    const levels=12+n*2,rows=[];
    for(let r=0;r<levels;r++){
      const links=[];
      for(let c=0;c<n-1;c++){
        if(Math.random()<0.42 && !links.includes(c-1)){links.push(c);c++;}
      }
      rows.push(links);
    }
    const loser=Math.floor(Math.random()*n);
    const labels=Array(n).fill('면제');labels[loser]='☕ 커피 쏘기';
    ladder={names:ns,rows,labels};
    draw(false);result.innerHTML='사다리가 준비되었습니다. <b>결과 공개</b>를 눌러주세요.';status.textContent='새 사다리를 만들었습니다.';
  }
  function destination(start){let p=start;for(const links of ladder.rows){if(links.includes(p))p++;else if(links.includes(p-1))p--;}return p}
  function drawEmpty(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#7a7068';ctx.font='700 26px sans-serif';ctx.textAlign='center';ctx.fillText('☕ 커피쏘기 사다리',canvas.width/2,canvas.height/2);result.innerHTML='참가자를 확인한 뒤 <b>사다리 만들기</b>를 눌러주세요.'}
  function draw(showPaths){
    if(!ladder){drawEmpty();return}
    const W=canvas.width,H=canvas.height,n=ladder.names.length,ml=80,mr=80,top=92,bottom=105;
    const step=(W-ml-mr)/(n-1),hstep=(H-top-bottom)/(ladder.rows.length-1);
    ctx.clearRect(0,0,W,H);ctx.textAlign='center';ctx.font='700 24px sans-serif';ctx.fillStyle='#2f2a26';
    ladder.names.forEach((name,i)=>{const x=ml+i*step;ctx.fillText(name,x,42);ctx.strokeStyle='#cdbfb1';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,H-bottom);ctx.stroke()});
    ctx.strokeStyle='#8b6749';ctx.lineWidth=6;ladder.rows.forEach((links,r)=>links.forEach(col=>{const y=top+r*hstep;ctx.beginPath();ctx.moveTo(ml+col*step,y);ctx.lineTo(ml+(col+1)*step,y);ctx.stroke()}));
    ctx.font='700 21px sans-serif';ladder.labels.forEach((lab,i)=>{ctx.fillStyle=lab.includes('커피')?'#b9574f':'#3f7d5c';ctx.fillText(lab,ml+i*step,H-42)});
    if(showPaths){const colors=['#b9574f','#3f7d5c','#5d6ea8','#b07a39','#6f5b8e','#3f7f86','#95605a','#65706f'];
      ladder.names.forEach((_,s)=>{let p=s;ctx.strokeStyle=colors[s%colors.length];ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(ml+p*step,top);ladder.rows.forEach((links,r)=>{const y=top+r*hstep;ctx.lineTo(ml+p*step,y);if(links.includes(p)){p++;ctx.lineTo(ml+p*step,y)}else if(links.includes(p-1)){p--;ctx.lineTo(ml+p*step,y)}});ctx.lineTo(ml+p*step,H-bottom);ctx.stroke()});
    }
  }
  function reveal(){if(!ladder)makeLadder();draw(true);const rows=ladder.names.map((name,i)=>({name,label:ladder.labels[destination(i)]}));const payer=rows.find(x=>x.label.includes('커피'));result.innerHTML=`🎉 오늘 커피는 <span style="font-size:1.25em;color:#b9574f">${payer.name}</span> 님이 쏩니다!<hr style="border:0;border-top:1px solid #dfd1c4;margin:10px 0">`+rows.map(x=>`☕ <b>${x.name}</b> → ${x.label}`).join('<br>');status.textContent='결과를 공개했습니다.'}

  document.getElementById('addPerson').addEventListener('click',()=>addPerson(''));
  document.getElementById('reset').addEventListener('click',reset);
  document.getElementById('make').addEventListener('click',makeLadder);
  document.getElementById('run').addEventListener('click',reveal);
  reset();
})();
</script>
</body>
</html>
